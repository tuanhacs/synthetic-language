model:
  size: nano
  context_len: 1024
  vocab_size: 6 # {0, 1, BOS, EOS, PAD, _}

data:
  dataset_dir: ../data/outputs/path_qa_cot_segments_smoke
  mode: frozen

train:
  max_steps: 5
  batch_size: 2
  lr: 3.0e-4
  warmup: 1
  log_every: 1
  eval_every: 5
  seed: 0
  out_dir: outputs/path_qa_cot_segments_smoke

eval:
  n_samples: 4
  temperature: 1.0
  cuts: [0]
  max_len: 1024
  gen_batch_size: 4
  seed: 0
