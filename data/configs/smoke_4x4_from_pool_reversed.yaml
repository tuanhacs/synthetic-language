# Build a dataset from an existing global codeword pool JSON.
# The file is a JSON array such as ["001", "101", ...].
language:
  graph: grid-6x6
  codeword_pool_file: ../codeword_pools/hard_ud_codebook_200_reversed.json
  code:
    type: ud # the words assigned from this pool are certified
  k: [1, 4] # independently sampled target |B_v| for each vertex
  assignment: arbitrary-overlap # disjoint | arbitrary-overlap
  overlap:
    support_size: [2, 4] # each shared codeword belongs to 2..4 vertices
    shared_codewords: 12
    max_restarts: 100
    candidate_trials: 10_000

data:
  walk_len: [4, 48]
  pool_tokens: 120_000_000
  split: [80, 10, 10]
  # reverse_walks: true
  seed: 0 # controls assignment, samples, noise and split
  noise: null
  context_len: 1600
