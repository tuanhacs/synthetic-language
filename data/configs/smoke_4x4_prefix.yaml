# Smoke config: smallest language that exercises the whole pipeline.
# grid 4x4 (|V| = 16), prefix-free base code of 3 words, pool C^6 = 729 codewords.
language:
  graph: grid-6x6 # |V| = 16
  code:
    type: ud # prefix-free | suffix-free | ud
    base_size: 3 # codewords of the base code C
    len_range: [1, 4] # base codeword lengths (len_range for ud)
    power_x: 5 # codeword pool = C^6 (|C|^x = 729 >= |V|*k = 64)
  k: 4 # codewords per vertex
  assignment: disjoint-random # pairwise disjoint B_v
data:
  walk_len: [16, 32] # vertices per walk, uniform in this range
  pool_tokens: 15_000_000 # total bits in the frozen pool
  split: [80, 10, 10] # train / valid / test, disjoint at string level
  seed: 42
  noise: null # {type: bit-flip|bit-delete|vertex-noise, gamma, rho}
  context_len: 512 # training context (packing + length warnings)
