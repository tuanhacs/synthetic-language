# Paired control for smoke_4x4_from_pool.yaml.
# Same graph, codebooks, RNG streams and chosen codewords; only the order of
# walk steps/codewords in every sentence is reversed. Bits inside a codeword
# are left unchanged.
language:
  graph: grid-6x6
  codeword_pool_file: ../codeword_pools/hard_ud_codebook_200.json
  code:
    type: ud
  k: [1, 4]
  assignment: arbitrary-overlap # disjoint | arbitrary-overlap
  overlap:
    support_size: [2, 4] # each shared codeword belongs to 2..4 vertices
    shared_codewords: 12
    max_restarts: 100
    candidate_trials: 10_000

data:
  walk_len: [4, 48]
  pool_tokens: 140_000_000
  split: [80, 10, 10]
  seed: 0
  reverse_walks: true
  noise: null
  context_len: 1600
