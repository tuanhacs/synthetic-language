# Smoke config: smallest language that exercises the whole pipeline.
# grid 4x4 (|V| = 16), prefix-free base code of 3 words, pool C^6 = 729 codewords.
language:
  graph: grid-6x6 # |V| = 16
  code:
    type: suffix-free # prefix-free | suffix-free | ud
    base_size: 3 # codewords of the base code C
    depth_range: [1, 4] # base codeword lengths (len_range for ud)
    power_x: 5 # codeword pool = C^6 (|C|^x = 729 >= |V|*k = 64)
  k: [1, 4] # codewords per vertex
  assignment: arbitrary-overlap
  overlap:
    support_size: [2, 4] # each shared codeword belongs to 2..4 vertices
    shared_codewords: 12
    max_restarts: 100
    candidate_trials: 10_000
data:
  walk_len: [4, 48] # vertices per walk, uniform in this range
  pool_tokens: 40_000_000 # total bits in the frozen pool
  split: [80, 10, 10] # train / valid / test, disjoint at string level
  seed: 0
  noise: null # {type: bit-flip|bit-delete|vertex-noise, gamma, rho}
  context_len: 1200 # training context (packing + length warnings)
