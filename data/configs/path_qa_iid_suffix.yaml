language:
  graph: grid-6x6
  # codeword_pool_file: ../codeword_pools/hard_ud_codebook_200.json
  code:
    type: prefix-free # prefix-free | suffix-free | ud
    base_size: 3 # codewords of the base code C
    depth_range: [1, 4] # base codeword lengths (len_range for ud)
    power_x: 5 # codeword pool = C^6 (|C|^x = 729 >= |V|*k = 64)
  k: [1, 4]
  assignment: disjoint-random

data:
  pool_tokens: 120_000_000
  split: [80, 10, 10]
  seed: 0
  noise: null
  context_len: 1600

task:
  type: path-qa
  query_len: [2, 4]
  segment_len: [2, 14]
  path_trials: 1000
  split_mode: iid
  pair_direction: unordered
