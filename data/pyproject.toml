[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthdata"
version = "0.1.0"
description = "Synthetic language (graph walks encoded by binary codebooks): language engine + dataset generation"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[tool.setuptools]
packages = ["synthdata", "synthdata.codes"]
